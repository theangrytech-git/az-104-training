name: Terraform azurerm Schema Diff Check

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  schema-diff:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: '1.6.6'

    - name: Init with current pinned version
      run: |
        echo "🔍 Initializing with locked provider version..."
        terraform init -input=false
        terraform providers schema -json > schema-locked.json

    - name: Extract locked azurerm version
      id: current_version
      run: |
        LOCKED_VERSION=$(terraform providers | grep azurerm | awk '{print $2}')
        echo "Locked azurerm version: $LOCKED_VERSION"
        echo "locked_version=$LOCKED_VERSION" >> $GITHUB_OUTPUT

    - name: Upgrade provider and capture latest schema
      run: |
        echo "🔄 Re-initializing with latest available provider..."
        terraform init -upgrade -input=false
        terraform providers schema -json > schema-latest.json

    - name: Extract latest azurerm version
      id: latest_version
      run: |
        LATEST_VERSION=$(terraform providers | grep azurerm | awk '{print $2}')
        echo "Latest azurerm version: $LATEST_VERSION"
        echo "latest_version=$LATEST_VERSION" >> $GITHUB_OUTPUT

    - name: Compare Versions
      run: |
        echo "🔎 Comparing versions..."
        if [ "${{ steps.current_version.outputs.locked_version }}" = "${{ steps.latest_version.outputs.latest_version }}" ]; then
          echo "✅ No version difference detected."
        else
          echo "⚠️ Version mismatch detected:"
          echo "    Locked : ${{ steps.current_version.outputs.locked_version }}"
          echo "    Latest : ${{ steps.latest_version.outputs.latest_version }}"
        fi

    - name: Compare azurerm provider schemas
      run: |
        jq '.provider_schemas["registry.terraform.io/hashicorp/azurerm"]' schema-locked.json > azurerm-locked.json
        jq '.provider_schemas["registry.terraform.io/hashicorp/azurerm"]' schema-latest.json > azurerm-latest.json

        echo "📊 Running schema diff..."
        diff azurerm-locked.json azurerm-latest.json > schema-diff.txt || true

        if [ -s schema-diff.txt ]; then
          echo "❌ Schema differences detected:"
          cat schema-diff.txt
          exit 1
        else
          echo "✅ No schema differences detected."
        fi
