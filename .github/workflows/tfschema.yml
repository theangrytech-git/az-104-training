name: Terraform azurerm Provider Version Check

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  version-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: '1.6.6'

    - name: Terraform Init (No Upgrade)
      run: terraform init -input=false

    - name: Verify azurerm Provider Version
      run: |
        EXPECTED_VERSION="3.71.0"
        ACTUAL_VERSION=$(terraform providers | grep azurerm | awk '{print $2}')

        echo "Expected version: $EXPECTED_VERSION"
        echo "Actual version:   $ACTUAL_VERSION"

        if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
          echo "❌ Provider version mismatch!"
          exit 1
        else
          echo "✅ azurerm provider version is correct."
        fi

