name: Compare Terraform azurerm Provider Versions (Log Only)

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  TF_VERSION: '1.6.6'
  CURRENT_PROVIDER_VERSION: '3.71.0'
  NEW_PROVIDER_VERSION: '3.88.0'

jobs:
  schema-diff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Write comparison script
        run: |
          cat << 'EOF' > compare-azurerm-versions.sh
          #!/usr/bin/env bash
          set -e

          CURRENT_VERSION=$1
          NEW_VERSION=$2
          PROVIDER=azurerm
          PROVIDER_PATH=registry.terraform.io/hashicorp/${PROVIDER}
          MIRROR_DIR="./provider-mirror"

          echo "🔍 Comparing ${PROVIDER} versions: $CURRENT_VERSION vs $NEW_VERSION"

          mkdir -p $MIRROR_DIR

          terraform providers mirror ./provider-mirror \
          -platform=linux_amd64 \
          registry.terraform.io/hashicorp/azurerm@${CURRENT_VERSION} \
          registry.terraform.io/hashicorp/azurerm@${NEW_VERSION}

          CURRENT_PATH="${MIRROR_DIR}/${PROVIDER_PATH}/${CURRENT_VERSION}/linux_amd64/terraform-provider-${PROVIDER}_v${CURRENT_VERSION}_x5"
          NEW_PATH="${MIRROR_DIR}/${PROVIDER_PATH}/${NEW_VERSION}/linux_amd64/terraform-provider-${PROVIDER}_v${NEW_VERSION}_x5"

          terraform providers schema -json -provider-path=$CURRENT_PATH > schema-${CURRENT_VERSION}.json
          terraform providers schema -json -provider-path=$NEW_PATH > schema-${NEW_VERSION}.json

          jq ".provider_schemas[\"${PROVIDER_PATH}\"]" schema-${CURRENT_VERSION}.json > schema-old.json
          jq ".provider_schemas[\"${PROVIDER_PATH}\"]" schema-${NEW_VERSION}.json > schema-new.json

          echo "📊 Running diff between schemas..."
          if diff -u schema-old.json schema-new.json > azurerm-schema-diff.txt; then
            echo "✅ No schema differences found."
          else
            echo "⚠️ Schema differences detected:"
            echo "-----------------------------------"
            cat azurerm-schema-diff.txt
            echo "-----------------------------------"
          fi
          EOF

          chmod +x compare-azurerm-versions.sh

      - name: Run comparison script and show diff in logs
        run: ./compare-azurerm-versions.sh $CURRENT_PROVIDER_VERSION $NEW_PROVIDER_VERSION
        continue-on-error: true
